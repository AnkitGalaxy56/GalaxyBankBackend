spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: mobile-banking

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

 

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

security:
  jwt:
    secret: ${APP_JWT_SECRET}

app:
  security:
    jwt-secret: ${APP_JWT_SECRET}
    registration-token-ttl-seconds: ${REGISTRATION_TOKEN_TTL_SECONDS:300}

  registration:
    otp-bypass-enabled: ${OTP_BYPASS_ENABLED:false}

server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  config:
    import: optional:file:./.env[.properties]
  application:
    name: allianza-portal-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Remote database: keep a couple of warm connections and ping idle ones so the first
      # request after a pause does not pay for a brand-new TLS connection.
      maximum-pool-size: 8
      minimum-idle: 2
      keepalive-time: 30000
      max-lifetime: 600000
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORTAL_API_PORT:8081}
  servlet:
    context-path: /api/v1

portal:
  jwt:
    secret: ${PORTAL_JWT_SECRET}
    ttl-minutes: ${PORTAL_JWT_TTL_MINUTES:30}
    refresh-ttl-hours: ${PORTAL_REFRESH_TOKEN_TTL_HOURS:8}
  otp:
    value: ${PORTAL_LOGIN_OTP:123456}
    ttl-minutes: ${PORTAL_OTP_TTL_MINUTES:5}
  requests:
    max-amount: ${PORTAL_REQUEST_MAX_AMOUNT:100000000}
    staff-can-authorise: ${PORTAL_STAFF_CAN_AUTHORISE:true}
    writes-per-minute: ${PORTAL_WRITES_PER_MINUTE:60}
  auth:
    max-failed-attempts: ${PORTAL_MAX_FAILED_ATTEMPTS:5}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: INFO
